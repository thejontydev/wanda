<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wanda — Launches Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Lora:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #FAF6EE;
    font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
    color: #1A1814;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  ::selection { background: #D9EFE7; }

  /* ============ LANDING ============ */
  .landing {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 48px;
    padding-bottom: max(48px, env(safe-area-inset-bottom, 48px));
    transition: opacity .55s cubic-bezier(0.22, 1, 0.36, 1), transform .6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .landing.gone { opacity: 0; transform: scale(.97); pointer-events: none; }

  /* faint drifting topographic contour backdrop */
  .bg-topo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; opacity: .5;
  }
  .bg-topo path {
    stroke: #1FA882; stroke-width: 1; fill: none; opacity: .15;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .bg-topo path:nth-child(2) { animation-delay: -4s; }
  .bg-topo path:nth-child(3) { animation-delay: -8s; }
  .bg-topo path:nth-child(4) { animation-delay: -12s; }
  .bg-topo path:nth-child(5) { animation-delay: -16s; }
  .bg-topo path:nth-child(6) { animation-delay: -20s; }
  @keyframes drift { to { transform: translateY(-16px); } }

  .stack {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    width: 100%;
  }

  .mark {
    height: clamp(44px, 8vw, 64px); width: auto; margin-bottom: 36px;
    animation: rise .9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .eyebrow {
    font-family: "Outfit", sans-serif; font-weight: 600;
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    color: #6E6A61; margin-bottom: 18px;
    display: flex; align-items: center; gap: 10px;
    animation: rise .9s cubic-bezier(0.22, 1, 0.36, 1) .06s both;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #1FA882;
    animation: blink 2.4s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }

  h1 {
    font-family: "Outfit", sans-serif; font-weight: 600;
    font-size: clamp(32px, 6vw, 80px);
    line-height: 1; letter-spacing: -.03em;
    color: #1A1814;
    margin: 0 0 20px; max-width: 14ch;
    text-wrap: balance;
    animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) .12s both;
  }

  .sub {
    font-family: "Outfit", sans-serif; font-weight: 400;
    font-size: clamp(16px, 1.7vw, 21px); line-height: 1.5;
    color: #6E6A61; margin: 0 0 40px; max-width: 36ch;
    text-wrap: balance;
    animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) .20s both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  /* ============ BUTTON ============ */
  .cta {
    position: relative; z-index: 2; overflow: hidden;
    font-family: "Outfit", sans-serif; font-weight: 600; font-size: 17px;
    letter-spacing: -.01em; color: #fff; white-space: nowrap;
    background: #1FA882; border: none; cursor: pointer;
    padding: 18px 36px 18px 32px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 12px;
    box-shadow: 0 6px 24px rgba(31,168,130,.38), 0 1px 0 rgba(255,255,255,.22) inset;
    transition: transform .25s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow .25s cubic-bezier(0.22, 1, 0.36, 1),
                background .2s;
    animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) .28s both,
               glow 3s ease-in-out 1.3s infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .cta:hover {
    transform: translateY(-2px);
    background: #18886A;
    box-shadow: 0 12px 36px rgba(31,168,130,.46), 0 1px 0 rgba(255,255,255,.22) inset;
  }
  .cta:active { transform: translateY(0) scale(.985); }

  @keyframes glow {
    0%, 100% { box-shadow: 0 6px 24px rgba(31,168,130,.32), 0 1px 0 rgba(255,255,255,.22) inset; }
    50%       { box-shadow: 0 8px 32px rgba(31,168,130,.56), 0 1px 0 rgba(255,255,255,.22) inset; }
  }

  /* shimmer sweep */
  .cta::before {
    content: ""; position: absolute; top: 0; left: -60%; width: 45%; height: 100%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.44), transparent);
    transform: skewX(-18deg);
    animation: sweep 3.5s ease-in-out 1.8s infinite;
  }
  @keyframes sweep { 0% { left: -60%; } 38%, 100% { left: 140%; } }

  .cta .plane { display: inline-flex; transition: transform .3s cubic-bezier(0.22, 1, 0.36, 1); }
  .cta:hover .plane { transform: translate(4px, -3px) rotate(8deg); }

  /* ============ JOURNEY OVERLAY ============ */
  .journey {
    position: fixed; inset: 0; z-index: 30;
    background: #1A1814;
    opacity: 0; pointer-events: none;
    transition: opacity .6s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: hidden;
  }
  .journey.open { opacity: 1; pointer-events: auto; }

  .sky { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* star twinkle */
  .star { fill: #FAF6EE; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .12; } 50% { opacity: .65; } }

  /* contour terrain draw-in */
  .contour {
    stroke: #1FA882; stroke-width: 1; fill: none; opacity: 0;
    stroke-dasharray: 2400; stroke-dashoffset: 2400;
  }
  .journey.draw .contour {
    opacity: .13;
    transition: stroke-dashoffset 2.6s cubic-bezier(0.22, 1, 0.36, 1), opacity .9s ease;
    stroke-dashoffset: 0;
  }

  /* flight arc */
  .arc {
    stroke: #1FA882; stroke-width: 2.5; fill: none;
    stroke-linecap: round; stroke-dasharray: 6 12;
    stroke-dashoffset: 1700; opacity: 0;
  }
  .journey.draw .arc {
    opacity: .85;
    transition: stroke-dashoffset 2.2s linear .3s, opacity .5s ease .3s;
    stroke-dashoffset: 0;
  }

  /* location pins */
  .pin { opacity: 0; transition: opacity .5s ease; }
  .journey.draw .pin { opacity: 1; }
  .pin-ring {
    transform-box: fill-box; transform-origin: center;
    animation: ping 2.2s ease-out infinite;
  }
  @keyframes ping { 0% { transform: scale(.4); opacity: .8; } 100% { transform: scale(2.6); opacity: 0; } }

  /* paper plane along arc */
  .plane-g { opacity: 0; }
  .journey.draw .plane-g { opacity: 1; transition: opacity .3s ease .4s; }
  .journey.arrived .plane-g { opacity: 0; transition: opacity .5s ease; }

  /* ============ REVEAL ============ */
  .reveal {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 48px;
    opacity: 0; transform: translateY(16px);
    transition: opacity .9s cubic-bezier(0.22, 1, 0.36, 1), transform .9s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }
  .journey.arrived .reveal { opacity: 1; transform: none; pointer-events: auto; }

  .reveal .mark { height: 44px; margin-bottom: 32px; }

  .reveal .planning {
    font-family: "Lora", Georgia, serif; font-style: italic; font-weight: 500;
    font-size: clamp(24px, 3.4vw, 44px); line-height: 1.2;
    color: #FAF6EE; margin: 0 0 20px; max-width: 20ch;
    text-wrap: balance;
  }

  .reveal .soon {
    font-family: "Outfit", sans-serif; font-weight: 500;
    font-size: clamp(14px, 1.4vw, 17px); letter-spacing: .04em;
    color: rgba(250,246,238,.5); margin: 0;
  }
  .reveal .soon b { color: #1FA882; font-weight: 600; }

  .replay {
    position: absolute;
    bottom: max(32px, env(safe-area-inset-bottom, 32px));
    left: 50%; transform: translateX(-50%);
    font-family: "Outfit", sans-serif; font-weight: 500; font-size: 13px;
    color: rgba(250,246,238,.36); background: none; border: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    opacity: 0; transition: opacity .6s ease 1.4s, color .2s;
    white-space: nowrap; -webkit-tap-highlight-color: transparent;
    padding: 8px 12px;
  }
  .journey.arrived .replay { opacity: 1; }
  .replay:hover { color: rgba(250,246,238,.75); }

  /* ============ MOBILE ============ */
  @media (max-width: 600px) {
    .landing { padding: 28px; padding-bottom: max(28px, env(safe-area-inset-bottom, 28px)); }
    .mark { height: clamp(40px, 11vw, 52px); margin-bottom: 28px; }
    h1 { font-size: clamp(30px, 8vw, 48px); margin-bottom: 16px; line-height: 1.02; }
    .sub { font-size: 16px; margin-bottom: 32px; max-width: 28ch; }
    .cta { font-size: 16px; padding: 16px 28px 16px 24px; gap: 10px; }
    .reveal { padding: 32px 28px; padding-bottom: max(80px, env(safe-area-inset-bottom, 80px)); }
    .reveal .mark { height: clamp(36px, 10vw, 48px); margin-bottom: 24px; }
    .reveal .planning { font-size: clamp(22px, 6vw, 36px); }
    .reveal .soon { font-size: 15px; }
  }

  @media (max-width: 380px) {
    h1 { font-size: 28px; }
    .cta { font-size: 15px; padding: 14px 22px 14px 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-topo path, .cta, .cta::before, .star, .pin-ring { animation: none !important; }
  }
</style>
</head>

<!-- ===================== JOURNEY OVERLAY ===================== -->
<div class="journey" id="journey" aria-hidden="true">
  <svg class="sky" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="glow-filter" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- stars (populated via JS) -->

    <!-- contour terrain -->

      <path class="contour" d="M-60,560 Q320,465 680,555 Q1040,645 1500,535"/>
      <path class="contour" d="M-60,660 Q340,560 700,648 Q1060,738 1500,638"/>
      <path class="contour" d="M-60,770 Q360,665 720,752 Q1080,840 1500,755"/>
    </g>

    <!-- flight arc -->
    <path id="arc" class="arc" d="M 220 720 Q 720 85 1230 240"/>

    <!-- origin pin (departure) -->
    <g class="pin" id="pin-origin">
      <circle class="pin-ring" cx="220" cy="720" r="9" fill="none" stroke="#1FA882" stroke-width="2"/>
      <circle cx="220" cy="720" r="5.5" fill="#1FA882"/>
    </g>

    <!-- destination pin (arrival) -->
    <g class="pin" id="pin-dest">
      <circle class="pin-ring" cx="1230" cy="240" r="9" fill="none" stroke="#1FA882" stroke-width="2" style="animation-delay:.8s"/>
      <circle cx="1230" cy="240" r="5.5" fill="#1FA882"/>
    </g>

    <!-- paper plane following the arc -->
    <g class="plane-g" filter="url(#glow-filter)">
      <g id="plane-icon">
        <path d="M16,0 L-10,-9 L-3,0 L-10,9 Z" fill="#FAF6EE"/>
      </g>
      <animateMotion
        id="planeMotion"
        dur="2.2s"
        begin="indefinite"
        fill="freeze"
        rotate="auto"
        keyPoints="0;1"
        keyTimes="0;1"
        calcMode="spline"
        keySplines="0.4 0 0.2 1">
        <mpath href="#arc"/>
      </animateMotion>
    </g>
  </svg>

<script>
  // Scatter stars randomly across the upper two-thirds of the sky
  (function () {
    const g = document.getElementById('stars');
    let html = '';
    for (let i = 0; i < 52; i++) {
      const x = (Math.random() * 1440).toFixed(0);
      const y = (Math.random() * 600).toFixed(0);
      const r = (Math.random() * 1.5 + 0.4).toFixed(1);
      const delay = (Math.random() * 4).toFixed(2);
      html += `<circle class="star" cx="${x}" cy="${y}" r="${r}" style="animation-delay:${delay}s"/>`;
    }
    g.innerHTML = html;
  })();

  const landing = document.getElementById('landing');
  const journey = document.getElementById('journey');
  const cta     = document.getElementById('cta');
  const replay  = document.getElementById('replay');
  const motion  = document.getElementById('planeMotion');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let timers = [];
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function launch() {
    clearTimers();
    landing.classList.add('gone');
    journey.classList.add('open');
    journey.setAttribute('aria-hidden', 'false');
    journey.classList.remove('draw', 'arrived');

    if (reduced) {
      journey.classList.add('draw');
      timers.push(setTimeout(() => journey.classList.add('arrived'), 400));
      return;
    }

    timers.push(setTimeout(() => journey.classList.add('draw'), 360));
    timers.push(setTimeout(() => { try { motion.beginElement(); } catch(e) {} }, 680));
    timers.push(setTimeout(() => journey.classList.add('arrived'), 2900));
  }

  cta.addEventListener('click', launch);
  replay.addEventListener('click', () => window.location.reload());
</script>
</body>
</html>
